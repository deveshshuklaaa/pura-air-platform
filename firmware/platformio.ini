[platformio]
default_envs = esp32_provisional

[env:esp32_provisional]
; Generic compile target only. Reported WROOM-DA/GPIO25 wiring is unresolved;
; this 4 MB target does not establish DA flash/antenna or carrier compatibility.
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.40900.250804
    platformio/tool-scons@4.40801.0
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
monitor_speed = 115200
